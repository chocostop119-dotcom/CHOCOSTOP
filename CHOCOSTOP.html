<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FBF6EF" />
<title>Dessert Cart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --cream: #FBF6EF;
    --surface: #FFFFFF;
    --ink: #3A2A22;
    --muted: #8A7A68;
    --border: #E9DECB;
    --berry: #D6456B;
    --berry-dark: #B5335A;
    --pistachio: #7C9473;
    --mango: #E8A33D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }
  #app {
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: 76px;
  }
  .dc-loading { padding: 40px; text-align: center; color: var(--muted); }

  .dc-header { padding: 18px 18px 12px; }
  .dc-header-inner {
    display: flex; align-items: center; gap: 8px;
    color: var(--berry-dark);
    background: none; border: none; padding: 0;
    font-family: inherit; cursor: pointer; width: 100%;
  }
  .dc-header h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 0.2px;
  }
  .dc-header-edit-icon { color: var(--muted); margin-left: 2px; }
  .dc-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dc-sync-btn {
    border: none; background: var(--surface); border: 1.5px solid var(--border); color: var(--muted);
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .dc-sync-synced { color: var(--pistachio); border-color: var(--pistachio); }
  .dc-sync-syncing { color: var(--mango); border-color: var(--mango); }
  .dc-sync-error { color: var(--berry-dark); border-color: var(--berry); }
  .dc-sync-status-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .dc-sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dc-sync-dot.synced { background: var(--pistachio); }
  .dc-sync-dot.syncing { background: var(--mango); }
  .dc-sync-dot.error { background: var(--berry); }
  .dc-awning {
    height: 8px;
    background: repeating-linear-gradient(45deg, var(--berry) 0px, var(--berry) 14px, var(--cream) 14px, var(--cream) 28px);
    opacity: 0.85;
  }
  .dc-main { flex: 1; padding: 16px; }

  .dc-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; color: var(--muted);
  }
  .dc-search input { border: none; outline: none; background: transparent; font-size: 15px; width: 100%; color: var(--ink); font-family: inherit; }

  .dc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .dc-tile {
    position: relative; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 10px; text-align: left; cursor: pointer; font-family: inherit;
  }
  .dc-tile:active { border-color: var(--berry); }
  .dc-tile-img {
    width: 100%; aspect-ratio: 1.3; border-radius: 10px; background: #F3E9D8; overflow: hidden;
    display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
  }
  .dc-tile-img img { width: 100%; height: 100%; object-fit: cover; }
  .dc-tile-noimg { font-family: 'Baloo 2', sans-serif; font-size: 26px; color: var(--mango); }
  .dc-tile-name { font-size: 14px; font-weight: 600; line-height: 1.25; margin-bottom: 2px; }
  .dc-tile-price { font-size: 13px; color: var(--berry-dark); font-weight: 700; }
  .dc-tile-badge {
    position: absolute; top: 8px; right: 8px; background: var(--berry); color: #fff;
    font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; padding: 0 6px; z-index: 2;
  }

  .dc-empty { text-align: center; padding: 60px 20px; color: var(--muted); display: flex; flex-direction: column; gap: 16px; align-items: center; }

  .dc-cartbar {
    position: sticky; bottom: 68px; left: 0; right: 0; margin: 0 16px;
    background: var(--ink); color: #fff; border: none; border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; box-shadow: 0 6px 20px rgba(58,42,34,0.25); width: calc(100% - 32px);
  }
  .dc-cartbar-count { background: var(--berry); border-radius: 8px; padding: 2px 8px; font-size: 13px; }
  .dc-cartbar-total { margin-left: auto; }

  .dc-tabs {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: var(--surface); border-top: 1.5px solid var(--border);
    display: flex; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .dc-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: none; color: var(--muted); font-family: inherit;
    font-size: 11px; font-weight: 600; padding: 6px 0; cursor: pointer;
  }
  .dc-tab-active { color: var(--berry-dark); }
  .dc-tab svg { pointer-events: none; }
  .dc-tab-icon { position: relative; display: inline-flex; }
  .dc-tab-badge {
    position: absolute; top: -5px; right: -9px; background: var(--berry); color: #fff;
    font-size: 9px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px; pointer-events: none;
  }

  .dc-btn-primary {
    background: var(--berry); color: #fff; border: none; border-radius: 11px; padding: 12px 18px;
    font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .dc-btn-primary:disabled { opacity: 0.5; }
  .dc-btn-secondary {
    background: var(--cream); color: var(--ink); border: 1.5px solid var(--border); border-radius: 11px;
    padding: 12px 18px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dc-btn-small { padding: 8px 12px; font-size: 13px; }
  .dc-btn-full { width: 100%; margin-top: 8px; }

  .dc-menu-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dc-menu-head h2 { font-family: 'Baloo 2', sans-serif; font-size: 18px; margin: 0; }
  .dc-muted { color: var(--muted); font-size: 14px; }
  .dc-menu-list { display: flex; flex-direction: column; gap: 8px; }
  .dc-menu-row {
    display: flex; align-items: center; gap: 10px; background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 10px;
  }
  .dc-menu-thumb {
    width: 44px; height: 44px; border-radius: 9px; background: #F3E9D8; overflow: hidden;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: 'Baloo 2', sans-serif; color: var(--mango); font-size: 18px;
  }
  .dc-menu-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .dc-menu-info { flex: 1; min-width: 0; }
  .dc-menu-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc-menu-price { font-size: 13px; color: var(--berry-dark); font-weight: 700; }
  .dc-icon-btn {
    border: none; background: var(--cream); color: var(--ink); width: 34px; height: 34px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .dc-icon-btn-danger { background: #FBE4E9; color: var(--berry-dark); }

  .dc-modal-overlay { position: fixed; inset: 0; background: rgba(58,42,34,0.45); display: flex; align-items: flex-end; z-index: 50; }
  .dc-modal {
    background: var(--cream); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
  }
  .dc-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dc-modal-head h3 { font-family: 'Baloo 2', sans-serif; font-size: 17px; margin: 0; display:flex; align-items:center; }

  .dc-form-field { margin-bottom: 14px; }
  .dc-form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .dc-form-field input {
    width: 100%; border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px;
    padding: 10px 12px; font-size: 15px; font-family: inherit; color: var(--ink); outline: none;
  }
  .dc-form-field input:focus { border-color: var(--berry); }

  .dc-image-row { display: flex; gap: 10px; align-items: flex-start; }
  .dc-image-preview { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #F3E9D8; }
  .dc-image-preview-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .dc-image-actions { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .dc-upload-label { position: relative; overflow: hidden; text-align: center; }
  .dc-file-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .dc-image-url { border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--ink); outline: none; width: 100%; }

  .dc-modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .dc-modal-actions .dc-btn-secondary, .dc-modal-actions .dc-btn-primary { flex: 1; }

  .dc-cart-lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .dc-cart-line { display: flex; align-items: center; gap: 8px; }
  .dc-cart-line-name { flex: 1; font-size: 14px; font-weight: 600; }
  .dc-cart-line-price { font-size: 13px; font-weight: 700; color: var(--berry-dark); width: 64px; text-align: right; }
  .dc-qty-stepper { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 9px; padding: 4px 8px; }
  .dc-qty-stepper button { border: none; background: none; color: var(--ink); cursor: pointer; display: flex; padding: 2px; }
  .dc-qty-stepper span { font-size: 14px; font-weight: 700; min-width: 16px; text-align: center; }

  .dc-pill-row { display: flex; gap: 8px; }
  .dc-pill-row-wrap { flex-wrap: wrap; margin-bottom: 16px; }
  .dc-pill {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .dc-pill-active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .dc-cart-total-row {
    display: flex; justify-content: space-between; align-items: center; font-family: 'Baloo 2', sans-serif;
    font-size: 18px; font-weight: 700; border-top: 1.5px dashed var(--border); padding-top: 12px; margin-top: 4px;
  }
  .dc-cart-actions { display: flex; gap: 10px; margin-top: 10px; }
  .dc-cart-actions .dc-btn-full { flex: 2; margin-top: 0; }
  .dc-btn-clear { flex: 1; color: var(--berry-dark); border-color: #F0C9D3; background: #FBEFF2; white-space: nowrap; }

  .dc-stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .dc-stat-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; }
  .dc-stat-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .dc-stat-value { font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 700; color: var(--berry-dark); }
  .dc-stat-value-sm { font-size: 14px; font-family: 'Inter', sans-serif; }

  .dc-chart-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; margin: 14px 0; }
  .dc-chart-card h3 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; }

  .dc-live-card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .dc-live-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .dc-live-time { font-size: 12px; font-weight: 700; color: var(--muted); }
  .dc-live-progress { font-size: 12px; font-weight: 700; color: var(--pistachio); }
  .dc-live-note { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 8px; }
  .dc-live-items { display: flex; flex-direction: column; gap: 2px; }
  .dc-live-item-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px; border: none; background: none;
    width: 100%; text-align: left; font-family: inherit; cursor: pointer; border-radius: 8px;
  }
  .dc-live-item-row:active { background: var(--cream); }
  .dc-live-checkbox {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .dc-live-checkbox.checked { background: var(--pistachio); border-color: var(--pistachio); }
  .dc-live-item-name { flex: 1; font-size: 14px; font-weight: 600; }
  .dc-live-item-name.done { text-decoration: line-through; color: var(--muted); }
  .dc-live-item-qty { font-size: 12px; color: var(--muted); font-weight: 600; }
  .dc-live-markall {
    margin-top: 10px; width: 100%; background: var(--cream); border: 1.5px solid var(--border);
    border-radius: 9px; padding: 8px; font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--muted); cursor: pointer;
  }
  .dc-recent { margin-top: 16px; }
  .dc-recent h3 { font-family: 'Baloo 2', sans-serif; font-size: 16px; margin-bottom: 10px; }
  .dc-recent-row { border-bottom: 1px solid var(--border); padding: 10px 0; }
  .dc-recent-time { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .dc-recent-items { font-size: 13px; margin-bottom: 3px; }
  .dc-recent-meta { display: flex; justify-content: space-between; font-size: 12px; }
  .dc-recent-pay { color: var(--pistachio); font-weight: 700; }
  .dc-recent-total { font-weight: 700; color: var(--berry-dark); }

  .dc-toast {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 12px 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 60;
    display: flex; align-items: center; gap: 12px;
  }
  .dc-toast-undo {
    background: var(--berry); color: #fff; border: none; border-radius: 7px;
    padding: 6px 12px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  .dc-offline-note { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 16px 0; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  "use strict";

  var ITEMS_KEY = "dc_items_v1";
  var ORDERS_KEY = "dc_orders_v1";
  var SHOP_NAME_KEY = "dc_shop_name_v1";
  var DEFAULT_SHOP_NAME = "Dessert Cart";
  var PAYMENT_METHODS = ["Cash", "Card", "UPI"];

  var items = [];
  var orders = [];
  var shopName = DEFAULT_SHOP_NAME;

  var currentTab = "order";
  var cart = {};
  var searchQuery = "";
  var dateFilter = "today";
  var editingItemId = null;
  var formImage = "";
  var selectedPayment = "UPI";
  var toastTimer = null;
  var pendingUndo = null;

  // ---------- Google Drive sync ----------
  var CLIENT_ID_KEY = "dc_google_client_id_v1";
  var DRIVE_CONNECTED_KEY = "dc_drive_connected_v1";
  var DRIVE_FILE_NAME = "dessert-cart-data.json";
  var DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
  var googleClientId = "";
  var driveAccessToken = null;
  var driveFileId = null;
  var driveSyncStatus = "disconnected"; // disconnected | connecting | synced | syncing | error
  var tokenClient = null;
  var driveSaveTimer = null;
  var suppressNextDriveUpload = false;

  // ---------- persistence ----------
  function loadAll() {
    try { var v = localStorage.getItem(ITEMS_KEY); items = v ? JSON.parse(v) : []; } catch (e) { items = []; }
    try { var v2 = localStorage.getItem(ORDERS_KEY); orders = v2 ? JSON.parse(v2) : []; } catch (e) { orders = []; }
    try { var v3 = localStorage.getItem(SHOP_NAME_KEY); shopName = v3 || DEFAULT_SHOP_NAME; } catch (e) { shopName = DEFAULT_SHOP_NAME; }
    try { googleClientId = localStorage.getItem(CLIENT_ID_KEY) || ""; } catch (e) { googleClientId = ""; }
  }
  function saveItems() {
    try { localStorage.setItem(ITEMS_KEY, JSON.stringify(items)); }
    catch (e) { showToast("Storage full — try smaller photos"); }
    scheduleDriveUpload();
  }
  function saveOrders() {
    try { localStorage.setItem(ORDERS_KEY, JSON.stringify(orders)); }
    catch (e) { showToast("Couldn't save order — storage full"); }
    scheduleDriveUpload();
  }
  function saveShopName() {
    try { localStorage.setItem(SHOP_NAME_KEY, shopName); } catch (e) {}
    scheduleDriveUpload();
  }

  // ---------- helpers ----------
  function currency(n) {
    n = Number(n || 0);
    return "\u20B9" + n.toLocaleString("en-IN", { maximumFractionDigits: 0 });
  }
  function dateKeyOf(ts) { var d = new Date(ts); return d.toISOString().slice(0, 10); }
  function startOfToday() { var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function showToast(msg, undoFn) {
    var el = document.getElementById("dc-toast");
    if (!el) return;
    pendingUndo = undoFn || null;
    el.innerHTML = "<span>" + escapeHtml(msg) + "</span>" +
      (undoFn ? '<button class="dc-toast-undo" data-action="undo-last">Undo</button>' : "");
    el.style.display = "flex";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.display = "none"; pendingUndo = null; }, undoFn ? 4000 : 2200);
  }
  function icon(name, size) {
    size = size || 18;
    var icons = {
      store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"/><path d="M9 21V13h6v8"/><path d="M3 9h18"/>',
      pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      minus: '<path d="M5 12h14"/>',
      trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
      x: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
      cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
      list: '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
      bar: '<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="13" y="8" width="3" height="10"/><rect x="19" y="4" width="0.01" height="0.01"/>',
      trend: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
      download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
      image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      checklist: '<path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="m9 6 2 2 4-4"/><path d="M9 13h12"/><path d="M9 18h12"/>',
      cloud: '<path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-2A5 5 0 0 0 6 18h11.5Z"/>'
    };
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (icons[name] || "") + "</svg>";
  }

  // ---------- image resize (keeps storage small) ----------
  function resizeImageFile(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var maxDim = 480;
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = function () { showToast("Couldn't read that image"); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- cart ----------
  function addToCart(itemId) { cart[itemId] = (cart[itemId] || 0) + 1; renderOrderTab(); }
  function changeQty(itemId, delta) {
    var q = (cart[itemId] || 0) + delta;
    if (q <= 0) delete cart[itemId]; else cart[itemId] = q;
  }
  function clearCart() { cart = {}; }
  function cartLines() {
    return Object.keys(cart).map(function (id) {
      var item = items.find(function (i) { return i.id === id; });
      if (!item) return null;
      return { id: item.id, name: item.name, price: item.price, qty: cart[id] };
    }).filter(Boolean);
  }
  function cartTotal(lines) { return lines.reduce(function (s, l) { return s + l.price * l.qty; }, 0); }
  function cartCount() { return Object.values(cart).reduce(function (s, q) { return s + q; }, 0); }

  // ---------- live orders ----------
  function orderIsPending(order) {
    return order.items.some(function (li) { return !li.done; });
  }
  function pendingOrders() {
    return orders.filter(orderIsPending).sort(function (a, b) { return a.timestamp - b.timestamp; });
  }

  // ---------- rendering ----------
  var app = document.getElementById("app");

  function render() {
    var html = "";
    html += '<header class="dc-header">';
    html += '<div class="dc-header-row">';
    html += '  <button class="dc-header-inner" data-action="open-name-edit">';
    html += icon("store", 22) + '<h1>' + escapeHtml(shopName) + '</h1>';
    html += '    <span class="dc-header-edit-icon">' + icon("pencil", 14) + '</span>';
    html += '  </button>';
    html += '  <button class="dc-sync-btn dc-sync-' + driveSyncStatus + '" data-action="open-sync" id="dc-sync-btn">' + icon("cloud", 18) + '</button>';
    html += '</div>';
    html += '</header>';
    html += '<div class="dc-awning"></div>';
    html += '<main class="dc-main" id="dc-main"></main>';
    html += '<div id="dc-cartbar-slot"></div>';
    html += '<nav class="dc-tabs">';
    html += tabButtonHtml("order", "list", "Order");
    html += tabButtonHtml("live", "checklist", "Live", pendingOrders().length);
    html += tabButtonHtml("menu", "store", "Menu");
    html += tabButtonHtml("sales", "bar", "Sales");
    html += '</nav>';
    html += '<div id="dc-modal-root"></div>';
    html += '<div class="dc-toast" id="dc-toast" style="display:none;"></div>';

  function tabButtonHtml(key, iconName, label, badge) {
    var active = currentTab === key ? " dc-tab-active" : "";
    var badgeHtml = badge ? '<span class="dc-tab-badge">' + badge + '</span>' : "";
    return '<button class="dc-tab' + active + '" data-action="switch-tab" data-tab="' + key + '"><span class="dc-tab-icon">' + icon(iconName, 20) + badgeHtml + '</span><span>' + label + "</span></button>";
  }

  function renderTabContent() {
    var main = document.getElementById("dc-main");
    if (currentTab === "order") renderOrderTab();
    else if (currentTab === "live") renderLiveTab();
    else if (currentTab === "menu") renderMenuTab();
    else if (currentTab === "sales") renderSalesTab();
    // re-highlight active tab button
    document.querySelectorAll(".dc-tab").forEach(function (btn) {
      btn.classList.toggle("dc-tab-active", btn.getAttribute("data-tab") === currentTab);
    });
  }

  // ----- Order tab -----
  function renderOrderTab() {
    var main = document.getElementById("dc-main");
    if (items.length === 0) {
      main.innerHTML =
        '<div class="dc-empty"><p>Your menu is empty.</p>' +
        '<button class="dc-btn-primary" data-action="goto-menu">Add your first item</button></div>';
      document.getElementById("dc-cartbar-slot").innerHTML = "";
      return;
    }
    var q = searchQuery.trim().toLowerCase();
    var list = items.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (q) list = list.filter(function (i) { return i.name.toLowerCase().indexOf(q) !== -1; });

    var html = '<div class="dc-search">' + icon("search", 16) +
      '<input id="dc-search-input" placeholder="Search items…" value="' + escapeHtml(searchQuery) + '" /></div>';
    html += '<div class="dc-grid" id="dc-grid">';
    list.forEach(function (item) {
      var qty = cart[item.id] || 0;
      html += '<button class="dc-tile" data-action="add-to-cart" data-id="' + item.id + '">';
      if (qty > 0) html += '<span class="dc-tile-badge">' + qty + "</span>";
      html += '<div class="dc-tile-img">';
      html += item.image ? '<img src="' + item.image + '" alt="">' : '<span class="dc-tile-noimg">' + escapeHtml(item.name.slice(0,1)) + "</span>";
      html += '</div>';
      html += '<div class="dc-tile-name">' + escapeHtml(item.name) + '</div>';
      html += '<div class="dc-tile-price">' + currency(item.price) + '</div>';
      html += '</button>';
    });
    html += "</div>";
    main.innerHTML = html;

    var input = document.getElementById("dc-search-input");
    input.addEventListener("input", function (e) {
      searchQuery = e.target.value;
      var caret = e.target.selectionStart;
      renderOrderTab();
      var newInput = document.getElementById("dc-search-input");
      newInput.focus();
      newInput.setSelectionRange(caret, caret);

  function renderCartBar() {
    var slot = document.getElementById("dc-cartbar-slot");

    if (count > 0 && currentTab === "order") {
      var lines = cartLines();
      slot.innerHTML =
        '<button class="dc-cartbar" data-action="open-cart">' +
        '<span class="dc-cartbar-count">' + count + '</span>' +
        '<span>Review order</span>' +
        '<span class="dc-cartbar-total">' + currency(cartTotal(lines)) + '</span>' +

  // ----- Menu tab -----
  var confirmDeleteId = null;
  function renderMenuTab() {
    var main = document.getElementById("dc-main");
    document.getElementById("dc-cartbar-slot").innerHTML = "";
    var sorted = items.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });

  // ----- Live Orders tab -----
  function pendingOrders() {
    return orders
      .filter(function (o) { return o.items.some(function (li) { return li.done === false; }); })
      .sort(function (a, b) { return a.timestamp - b.timestamp; });
  }

  function refreshTabBadges() {
    var btn = document.querySelector('.dc-tab[data-tab="live"] .dc-tab-icon');
    if (!btn) return;
    var count = pendingOrders().length;
    var existing = btn.querySelector(".dc-tab-badge");
    if (count > 0) {
      if (existing) existing.textContent = count;
      else btn.insertAdjacentHTML("beforeend", '<span class="dc-tab-badge">' + count + '</span>');
    } else if (existing) {
      existing.remove();
    }
  }

  function renderLiveTab() {
    var main = document.getElementById("dc-main");
    document.getElementById("dc-cartbar-slot").innerHTML = "";
    var pending = pendingOrders();
    if (pending.length === 0) {
      main.innerHTML = '<div class="dc-empty"><p>All caught up — no pending orders.</p></div>';
      return;
    }
    var html = "";
    pending.forEach(function (o) {
      var doneCount = o.items.filter(function (li) { return li.done === true; }).length;
      var d = new Date(o.timestamp);
      html += '<div class="dc-live-card">';
      html += '<div class="dc-live-head"><span class="dc-live-time">' +
        d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) + '</span>' +
        '<span class="dc-live-progress">' + doneCount + '/' + o.items.length + ' done</span></div>';
      if (o.note) html += '<div class="dc-live-note">' + escapeHtml(o.note) + '</div>';
      html += '<div class="dc-live-items">';
      o.items.forEach(function (li) {
        var isDone = li.done === true;
        html += '<button class="dc-live-item-row" data-action="toggle-live-item" data-order="' + o.id + '" data-item="' + li.itemId + '">';
        html += '<span class="dc-live-checkbox' + (isDone ? " checked" : "") + '">' + (isDone ? icon("check", 13) : "") + '</span>';
        html += '<span class="dc-live-item-name' + (isDone ? " done" : "") + '">' + escapeHtml(li.name) + '</span>';
        html += '<span class="dc-live-item-qty">×' + li.qty + '</span>';
        html += '</button>';
      });
      html += '</div>';
      if (doneCount < o.items.length) {
        html += '<button class="dc-live-markall" data-action="mark-all-done" data-order="' + o.id + '">Mark all done</button>';
      }
      html += '</div>';
    });
    main.innerHTML = html;
  }

  function toggleLiveItem(orderId, itemId) {
    var prevDone = null;
    orders = orders.map(function (o) {
      if (o.id !== orderId) return o;
      var items = o.items.map(function (li) {
        if (li.itemId !== itemId) return li;
        prevDone = li.done;
        return Object.assign({}, li, { done: !li.done });
      });
      return Object.assign({}, o, { items: items });
    });
    saveOrders();
    var stillPending = orders.some(function (o) { return o.id === orderId && o.items.some(function (li) { return li.done === false; }); });
    renderLiveTab();
    refreshTabBadges();
    if (prevDone === false) {
      // item was just marked done (and may have completed the whole order) — offer undo
      showToast(stillPending ? "Marked done" : "Order complete \u2713", function () {
        revertItemDone(orderId, itemId, false);
      });
    }
  }

  function revertItemDone(orderId, itemId, prevDoneValue) {
    orders = orders.map(function (o) {
      if (o.id !== orderId) return o;
      return Object.assign({}, o, { items: o.items.map(function (li) {
        return li.itemId === itemId ? Object.assign({}, li, { done: prevDoneValue }) : li;
      }) });
    });
    saveOrders();
    if (currentTab === "live") renderLiveTab();
    refreshTabBadges();
  }

  function markAllDone(orderId) {
    var prevStates = {};
    orders = orders.map(function (o) {
      if (o.id !== orderId) return o;
      o.items.forEach(function (li) { prevStates[li.itemId] = li.done; });
      return Object.assign({}, o, { items: o.items.map(function (li) { return Object.assign({}, li, { done: true }); }) });
    });
    saveOrders();
    renderLiveTab();
    refreshTabBadges();
    showToast("Order complete \u2713", function () {
      orders = orders.map(function (o) {
        if (o.id !== orderId) return o;
        return Object.assign({}, o, { items: o.items.map(function (li) { return Object.assign({}, li, { done: prevStates[li.itemId] }); }) });
      });
      saveOrders();
      if (currentTab === "live") renderLiveTab();
      refreshTabBadges();
    });
  }

  // ----- Sales tab -----
  function filteredOrders() {
    if (dateFilter === "all") return orders;
    var now = Date.now();
    var cutoff = startOfToday();
    if (dateFilter === "week") cutoff = now - 7 * 86400000;
    if (dateFilter === "month") cutoff = now - 30 * 86400000;
    return orders.filter(function (o) { return o.timestamp >= cutoff; });
  }

  function renderSalesTab() {
    var main = document.getElementById("dc-main");
    document.getElementById("dc-cartbar-slot").innerHTML = "";
    var fo = filteredOrders();
    var totalRevenue = fo.reduce(function (s, o) { return s + o.total; }, 0);
    var totalOrders = fo.length;
    var avgOrder = totalOrders ? totalRevenue / totalOrders : 0;

    var itemSalesMap = {};
    fo.forEach(function (o) {
      o.items.forEach(function (li) {
        if (!itemSalesMap[li.name]) itemSalesMap[li.name] = { name: li.name, qty: 0, revenue: 0 };
        itemSalesMap[li.name].qty += li.qty;
        itemSalesMap[li.name].revenue += li.price * li.qty;
      });
    });
    var topItems = Object.values(itemSalesMap).sort(function (a, b) { return b.qty - a.qty; }).slice(0, 8);

    var dailyMap = {};
    fo.forEach(function (o) {
      var k = dateKeyOf(o.timestamp);
      dailyMap[k] = (dailyMap[k] || 0) + o.total;
    });
    var daily = Object.keys(dailyMap).sort().map(function (k) { return { date: k.slice(5), revenue: dailyMap[k] }; });

    var recent = fo.slice().sort(function (a, b) { return b.timestamp - a.timestamp; }).slice(0, 25);

    var html = '<div class="dc-pill-row dc-pill-row-wrap">';
    [["today","Today"],["week","7 days"],["month","30 days"],["all","All time"]].forEach(function (pair) {
      html += '<button class="dc-pill' + (dateFilter === pair[0] ? " dc-pill-active" : "") + '" data-action="set-date-filter" data-filter="' + pair[0] + '">' + pair[1] + '</button>';
    });
    html += '</div>';

    html += '<div class="dc-stat-grid">' +
      statCard("Revenue", currency(totalRevenue)) +
      statCard("Orders", totalOrders) +
      statCard("Avg. order", currency(avgOrder)) +
      statCard("Top seller", topItems[0] ? escapeHtml(topItems[0].name) : "—", true) +
      '</div>';

    html += '<button class="dc-btn-secondary dc-btn-full" data-action="export-excel">' + icon("download", 16) + ' Export to Excel</button>';

    if (daily.length > 0) {
      html += '<div class="dc-chart-card"><h3>' + icon("trend", 16) + ' &nbsp;Revenue by day</h3>' + lineChartSvg(daily) + '</div>';
    }
    if (topItems.length > 0) {
      html += '<div class="dc-chart-card"><h3>Top items</h3>' + barChartSvg(topItems) + '</div>';
    }

    html += '<div class="dc-recent"><h3>Recent orders</h3>';
    if (recent.length === 0) html += '<p class="dc-muted">No orders in this range yet.</p>';
    recent.forEach(function (o) {
      var d = new Date(o.timestamp);
      html += '<div class="dc-recent-row">';
      html += '<div class="dc-recent-time">' + d.toLocaleDateString("en-IN", { day: "2-digit", month: "short" }) + ' · ' + d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) + '</div>';
      html += '<div class="dc-recent-items">' + escapeHtml(o.items.map(function (li) { return li.name + " ×" + li.qty; }).join(", ")) + (o.note ? " — " + escapeHtml(o.note) : "") + '</div>';
      html += '<div class="dc-recent-meta"><span class="dc-recent-pay">' + escapeHtml(o.paymentMethod) + '</span><span class="dc-recent-total">' + currency(o.total) + '</span></div>';
      html += '</div>';
    });
    html += '</div>';

    main.innerHTML = html;
  }

  function statCard(label, value, small) {
    return '<div class="dc-stat-card"><div class="dc-stat-label">' + label + '</div>' +
      '<div class="dc-stat-value' + (small ? ' dc-stat-value-sm' : '') + '">' + value + '</div></div>';
  }

  function lineChartSvg(data) {
    var w = 280, h = 140, padL = 34, padB = 18, padT = 8, padR = 8;
    var max = Math.max.apply(null, data.map(function (d) { return d.revenue; })) || 1;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
    var pts = data.map(function (d, i) {
      var x = padL + stepX * i;
      var y = padT + innerH - (d.revenue / max) * innerH;
      return [x, y];
    });
    var poly = pts.map(function (p) { return p[0] + "," + p[1]; }).join(" ");
    var dots = pts.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#D6456B"/>'; }).join("");
    var labels = data.map(function (d, i) {
      if (data.length > 6 && i % Math.ceil(data.length / 6) !== 0) return "";
      return '<text x="' + pts[i][0] + '" y="' + (h - 4) + '" font-size="9" fill="#8A7A68" text-anchor="middle">' + d.date + '</text>';
    }).join("");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:100%;height:auto;">' +
      '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + innerH) + '" stroke="#E9DECB"/>' +
      '<line x1="' + padL + '" y1="' + (padT + innerH) + '" x2="' + (padL + innerW) + '" y2="' + (padT + innerH) + '" stroke="#E9DECB"/>' +
      '<polyline points="' + poly + '" fill="none" stroke="#D6456B" stroke-width="2.5"/>' +
      dots + labels + "</svg>";
  }

  function barChartSvg(data) {
    var rowH = 26, gap = 10, labelW = 88, w = 280;
    var max = Math.max.apply(null, data.map(function (d) { return d.qty; })) || 1;
    var barMaxW = w - labelW - 40;
    var h = data.length * (rowH + gap);
    var bars = data.map(function (d, i) {
      var y = i * (rowH + gap);
      var bw = Math.max(4, (d.qty / max) * barMaxW);
      return '<text x="0" y="' + (y + rowH / 2 + 4) + '" font-size="11" fill="#3A2A22">' + escapeHtml(d.name.length > 14 ? d.name.slice(0,13) + "…" : d.name) + '</text>' +
        '<rect x="' + labelW + '" y="' + y + '" width="' + bw + '" height="' + rowH + '" rx="5" fill="#7C9473"/>' +
        '<text x="' + (labelW + bw + 6) + '" y="' + (y + rowH / 2 + 4) + '" font-size="11" fill="#8A7A68">' + d.qty + '</text>';
    }).join("");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:100%;height:auto;">' + bars + "</svg>";
  }

  function exportExcel() {
    if (typeof XLSX === "undefined") { showToast("Connect to internet once to load the export tool"); return; }
    var fo = filteredOrders();
    if (!fo.length) { showToast("No orders in this range"); return; }
    var rows = [];
    fo.forEach(function (o) {
      var d = new Date(o.timestamp);
      o.items.forEach(function (li) {
        rows.push({
          Date: d.toLocaleDateString("en-IN"),
          Time: d.toLocaleTimeString("en-IN"),
          Item: li.name,
          Quantity: li.qty,
          "Item Price": li.price,
          "Line Total": li.price * li.qty,
          "Order Total": o.total,
          "Payment Method": o.paymentMethod,
          Note: o.note || "",
          "Order ID": o.id
        });
      });
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Orders");
    var itemSalesMap = {};
    fo.forEach(function (o) {
      o.items.forEach(function (li) {
        if (!itemSalesMap[li.name]) itemSalesMap[li.name] = { name: li.name, qty: 0, revenue: 0 };
        itemSalesMap[li.name].qty += li.qty;
        itemSalesMap[li.name].revenue += li.price * li.qty;
      });
    });
    var summary = Object.values(itemSalesMap).sort(function (a, b) { return b.revenue - a.revenue; })
      .map(function (s) { return { Item: s.name, "Units Sold": s.qty, Revenue: s.revenue }; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "Item Summary");
    XLSX.writeFile(wb, "dessert-cart-sales-" + dateKeyOf(Date.now()) + ".xlsx");
  }

  // ---------- Google Drive sync ----------
  function currentDataSnapshot() {
    return JSON.stringify({ items: items, orders: orders, shopName: shopName, savedAt: Date.now() });
  }

  function setSyncStatus(status) {
    driveSyncStatus = status;
    var btn = document.getElementById("dc-sync-btn");
    if (btn) btn.className = "dc-sync-btn dc-sync-" + status;
    var modalDot = document.getElementById("dc-sync-modal-dot");
    var modalText = document.getElementById("dc-sync-modal-text");
    if (modalDot) modalDot.className = "dc-sync-dot " + status;
    if (modalText) modalText.textContent = syncStatusLabel(status);
  }

  function syncStatusLabel(status) {
    if (status === "synced") return "Connected — synced";
    if (status === "syncing") return "Syncing…";
    if (status === "connecting") return "Connecting…";
    if (status === "error") return "Couldn't sync — tap Connect to retry";
    return "Not connected";
  }

  function ensureTokenClient() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
    if (tokenClient && tokenClient.__clientId === googleClientId) return tokenClient;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: googleClientId,
      scope: DRIVE_SCOPE,
      callback: handleTokenResponse
    });
    tokenClient.__clientId = googleClientId;
    return tokenClient;
  }

  function connectDrive(promptType) {
    if (!googleClientId) { openSyncModal(); return; }
    if (!window.google || !google.accounts) {
      showToast("Still loading Google Sign-In — try again in a moment");
      return;
    }
    setSyncStatus("connecting");
    var client = ensureTokenClient();
    if (!client) { setSyncStatus("error"); return; }
    client.requestAccessToken({ prompt: promptType === undefined ? "consent" : promptType });
  }

  function handleTokenResponse(resp) {
    if (!resp || resp.error || !resp.access_token) {
      setSyncStatus("error");
      showToast("Google sign-in didn't complete");
      return;
    }
    driveAccessToken = resp.access_token;
    try { localStorage.setItem(DRIVE_CONNECTED_KEY, "1"); } catch (e) {}
    setSyncStatus("syncing");
    findOrCreateDriveFile();
  }

  function driveHeaders(extra) {
    var h = { Authorization: "Bearer " + driveAccessToken };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }

  function findOrCreateDriveFile() {
    var url = "https://www.googleapis.com/drive/v3/files?spaces=drive&q=" +
      encodeURIComponent("name = '" + DRIVE_FILE_NAME + "' and trashed = false") + "&fields=files(id,name)";
    fetch(url, { headers: driveHeaders() })
      .then(function (r) { if (!r.ok) throw new Error("list failed " + r.status); return r.json(); })
      .then(function (data) {
        if (data.files && data.files.length > 0) {
          driveFileId = data.files[0].id;
          downloadDriveFile();
        } else {
          createDriveFile();
        }
      })
      .catch(function (err) { setSyncStatus("error"); });
  }

  function downloadDriveFile() {
    fetch("https://www.googleapis.com/drive/v3/files/" + driveFileId + "?alt=media", { headers: driveHeaders() })
      .then(function (r) { if (!r.ok) throw new Error("download failed " + r.status); return r.text(); })
      .then(function (text) {
        var remote;
        try { remote = JSON.parse(text); } catch (e) { remote = null; }
        if (remote) {
          items = remote.items || [];
          orders = remote.orders || [];
          shopName = remote.shopName || DEFAULT_SHOP_NAME;
          suppressNextDriveUpload = true;
          try { localStorage.setItem(ITEMS_KEY, JSON.stringify(items)); } catch (e) {}
          try { localStorage.setItem(ORDERS_KEY, JSON.stringify(orders)); } catch (e) {}
          try { localStorage.setItem(SHOP_NAME_KEY, shopName); } catch (e) {}
          render();
        }
        setSyncStatus("synced");
        showToast("Synced from Google Drive \u2713");
      })
      .catch(function (err) { setSyncStatus("error"); });
  }

  function createDriveFile() {
    var boundary = "dcboundary" + uid();
    var metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
    var body =
      "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) + "\r\n" +
      "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + currentDataSnapshot() + "\r\n" +
      "--" + boundary + "--";
    fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method: "POST",
      headers: driveHeaders({ "Content-Type": "multipart/related; boundary=" + boundary }),
      body: body
    })
      .then(function (r) { if (!r.ok) throw new Error("create failed " + r.status); return r.json(); })
      .then(function (data) {
        driveFileId = data.id;
        setSyncStatus("synced");
        showToast("Google Drive connected \u2713");
      })
      .catch(function (err) { setSyncStatus("error"); });
  }

  function scheduleDriveUpload() {
    if (suppressNextDriveUpload) { suppressNextDriveUpload = false; return; }
    if (!driveAccessToken || !driveFileId) return;
    setSyncStatus("syncing");
    clearTimeout(driveSaveTimer);
    driveSaveTimer = setTimeout(uploadDriveFile, 1200);
  }

  function uploadDriveFile() {
    if (!driveAccessToken || !driveFileId) return;
    fetch("https://www.googleapis.com/upload/drive/v3/files/" + driveFileId + "?uploadType=media", {
      method: "PATCH",
      headers: driveHeaders({ "Content-Type": "application/json" }),
      body: currentDataSnapshot()
    })
      .then(function (r) {
        if (!r.ok) throw new Error("upload failed " + r.status);
        setSyncStatus("synced");
      })
      .catch(function () { setSyncStatus("error"); });
  }

  function tryAutoReconnect() {
    var wasConnected = false;
    try { wasConnected = localStorage.getItem(DRIVE_CONNECTED_KEY) === "1"; } catch (e) {}
    if (!wasConnected || !googleClientId) return;
    var attempts = 0;
    var tryInit = function () {
      attempts++;
      if (window.google && google.accounts && google.accounts.oauth2) {
        connectDrive("");
      } else if (attempts < 40) {
        setTimeout(tryInit, 250);
      }
    };
    tryInit();
  }

  // ---------- Modals ----------
  function closeModal() { document.getElementById("dc-modal-root").innerHTML = ""; }

  function openCartModal() {
    selectedPayment = "UPI";
    renderCartModal();
  }

  function renderCartModal() {
    var lines = cartLines();
    var total = cartTotal(lines);
    var html = '<div class="dc-modal-overlay" data-action="close-modal-bg">';
    html += '<div class="dc-modal" id="dc-cart-modal">';
    html += '<div class="dc-modal-head"><h3>' + icon("cart", 18) + '&nbsp;Review order</h3>' +
      '<button class="dc-icon-btn" data-action="close-modal">' + icon("x", 18) + '</button></div>';
    html += '<div class="dc-cart-lines" id="dc-cart-lines">' + cartLinesHtml(lines) + '</div>';
    html += '<div class="dc-form-field"><label>Payment method</label><div class="dc-pill-row" id="dc-payment-pills">';
    PAYMENT_METHODS.forEach(function (m) {
      html += '<button class="dc-pill' + (selectedPayment === m ? " dc-pill-active" : "") + '" data-action="set-payment" data-method="' + m + '">' + m + '</button>';
    });
    html += '</div></div>';
    html += '<div class="dc-form-field"><label>Note (optional)</label><input id="dc-order-note" placeholder="e.g. regular customer"></div>';
    html += '<div class="dc-cart-total-row" id="dc-cart-total-row"><span>Total</span><span>' + currency(total) + '</span></div>';
    html += '<div class="dc-cart-actions">';
    html += '<button class="dc-btn-secondary dc-btn-clear" data-action="clear-order">' + icon("trash", 15) + ' Clear order</button>';
    html += '<button class="dc-btn-primary dc-btn-full" data-action="confirm-order" ' + (lines.length === 0 ? "disabled" : "") + '>Confirm order</button>';
    html += '</div></div></div>';
    document.getElementById("dc-modal-root").innerHTML = html;
  }

  function cartLinesHtml(lines) {
    return lines.map(function (l) {
      return '<div class="dc-cart-line" data-line="' + l.id + '">' +
        '<div class="dc-cart-line-name">' + escapeHtml(l.name) + '</div>' +
        '<div class="dc-qty-stepper">' +
        '<button data-action="cart-qty" data-id="' + l.id + '" data-delta="-1">' + icon("minus", 14) + '</button>' +
        '<span>' + l.qty + '</span>' +
        '<button data-action="cart-qty" data-id="' + l.id + '" data-delta="1">' + icon("plus", 14) + '</button>' +
        '</div>' +
        '<div class="dc-cart-line-price">' + currency(l.price * l.qty) + '</div>' +
        '</div>';
    }).join("");
  }

  function refreshCartModalLines() {
    var lines = cartLines();
    var total = cartTotal(lines);
    var linesEl = document.getElementById("dc-cart-lines");
    var totalEl = document.getElementById("dc-cart-total-row");
    var confirmBtn = document.querySelector('[data-action="confirm-order"]');
    if (linesEl) linesEl.innerHTML = cartLinesHtml(lines);
    if (totalEl) totalEl.innerHTML = "<span>Total</span><span>" + currency(total) + "</span>";
    if (confirmBtn) confirmBtn.disabled = lines.length === 0;
    renderCartBar();
  }

  function openItemForm(item) {
    editingItemId = item ? item.id : null;
    formImage = item ? (item.image || "") : "";
    var html = '<div class="dc-modal-overlay" data-action="close-modal-bg">';
    html += '<div class="dc-modal">';
    html += '<div class="dc-modal-head"><h3>' + (item ? "Edit item" : "Add item") + '</h3>' +
      '<button class="dc-icon-btn" data-action="close-modal">' + icon("x", 18) + '</button></div>';
    html += '<div class="dc-form-field"><label>Name</label><input id="dc-item-name" value="' + escapeHtml(item ? item.name : "") + '" placeholder="e.g. Mango Kulfi"></div>';
    html += '<div class="dc-form-field"><label>Price (\u20B9)</label><input id="dc-item-price" type="number" inputmode="decimal" value="' + (item ? item.price : "") + '" placeholder="e.g. 60"></div>';
    html += '<div class="dc-form-field"><label>Image (optional)</label><div class="dc-image-row">';
    html += '<img id="dc-image-preview" class="dc-image-preview' + (formImage ? "" : " dc-image-preview-empty") + '" ' + (formImage ? 'src="' + formImage + '"' : "") + ' />';
    html += '<div class="dc-image-actions">';
    html += '<label class="dc-btn-secondary dc-btn-small dc-upload-label">Upload photo<input type="file" accept="image/*" class="dc-file-input" id="dc-file-input"></label>';
    html += '<input class="dc-image-url" id="dc-image-url" placeholder="or paste image URL" value="' + (formImage && formImage.indexOf("data:") === 0 ? "" : escapeHtml(formImage)) + '">';
    html += '</div></div></div>';
    html += '<div class="dc-modal-actions"><button class="dc-btn-secondary" data-action="close-modal">Cancel</button>' +
      '<button class="dc-btn-primary" data-action="save-item">Save item</button></div>';
    html += '</div></div>';
    document.getElementById("dc-modal-root").innerHTML = html;

    document.getElementById("dc-file-input").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      resizeImageFile(file, function (dataUrl) {
        formImage = dataUrl;
        updateImagePreview();
        document.getElementById("dc-image-url").value = "";
      });
    });
    document.getElementById("dc-image-url").addEventListener("input", function (e) {
      formImage = e.target.value;
      updateImagePreview();
    });
  }

  function updateImagePreview() {
    var img = document.getElementById("dc-image-preview");
    if (!img) return;
    if (formImage) {
      img.src = formImage;
      img.classList.remove("dc-image-preview-empty");
    } else {
      img.removeAttribute("src");
      img.classList.add("dc-image-preview-empty");
    }
  }

  function saveItemFromForm() {
    var name = document.getElementById("dc-item-name").value.trim();
    var price = Number(document.getElementById("dc-item-price").value);
    if (!name || isNaN(price)) { showToast("Enter a name and a valid price"); return; }
    if (editingItemId) {
      items = items.map(function (i) { return i.id === editingItemId ? { id: i.id, name: name, price: price, image: formImage || "" } : i; });
      showToast("Item updated");
    } else {
      items.push({ id: uid(), name: name, price: price, image: formImage || "" });
      showToast("Item added");
    }
    saveItems();
    closeModal();
    renderTabContent();
  }

  function openSyncModal() {
    var html = '<div class="dc-modal-overlay" data-action="close-modal-bg">';
    html += '<div class="dc-modal">';
    html += '<div class="dc-modal-head"><h3>' + icon("cloud", 18) + '&nbsp;Google Drive sync</h3><button class="dc-icon-btn" data-action="close-modal">' + icon("x", 18) + '</button></div>';
    html += '<div class="dc-sync-status-row"><span class="dc-sync-dot ' + driveSyncStatus + '" id="dc-sync-modal-dot"></span><span id="dc-sync-modal-text">' + syncStatusLabel(driveSyncStatus) + '</span></div>';
    html += '<div class="dc-form-field"><label>Google OAuth Client ID</label>' +
      '<input id="dc-client-id-input" value="' + escapeHtml(googleClientId) + '" placeholder="xxxxx.apps.googleusercontent.com"></div>';
    html += '<p class="dc-muted" style="margin-top:-6px;">Paste the Client ID from your Google Cloud Console (one-time setup — ask me if you need the steps).</p>';
    html += '<div class="dc-modal-actions">';
    if (driveAccessToken) {
      html += '<button class="dc-btn-secondary" data-action="disconnect-drive">Disconnect</button>';
    } else {
      html += '<button class="dc-btn-secondary" data-action="close-modal">Cancel</button>';
    }
    html += '<button class="dc-btn-primary" data-action="save-and-connect-drive">' + (driveAccessToken ? "Reconnect" : "Connect") + '</button>';
    html += '</div></div></div>';
    document.getElementById("dc-modal-root").innerHTML = html;
  }

  function disconnectDrive() {
    driveAccessToken = null;
    driveFileId = null;
    try { localStorage.removeItem(DRIVE_CONNECTED_KEY); } catch (e) {}
    setSyncStatus("disconnected");
    closeModal();
    showToast("Disconnected from Google Drive");
  }

  function openNameEditModal() {
    var html = '<div class="dc-modal-overlay" data-action="close-modal-bg">';
    html += '<div class="dc-modal">';
    html += '<div class="dc-modal-head"><h3>Shop name</h3><button class="dc-icon-btn" data-action="close-modal">' + icon("x", 18) + '</button></div>';
    html += '<div class="dc-form-field"><label>This shows at the top of the app</label>' +
      '<input id="dc-shop-name-input" value="' + escapeHtml(shopName) + '" placeholder="e.g. Priya\'s Dessert Cart"></div>';
    html += '<div class="dc-modal-actions"><button class="dc-btn-secondary" data-action="close-modal">Cancel</button>' +
      '<button class="dc-btn-primary" data-action="save-shop-name">Save</button></div>';
    html += '</div></div>';
    document.getElementById("dc-modal-root").innerHTML = html;
    var input = document.getElementById("dc-shop-name-input");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }

  // ---------- event delegation ----------
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if (action === "switch-tab") { currentTab = el.getAttribute("data-tab"); renderTabContent(); }
    else if (action === "undo-last") {
      if (pendingUndo) { pendingUndo(); pendingUndo = null; }
      document.getElementById("dc-toast").style.display = "none";
    }
    else if (action === "goto-menu") { currentTab = "menu"; render(); }
    else if (action === "add-to-cart") { addToCart(id); }
    else if (action === "open-cart") { openCartModal(); }
    else if (action === "close-modal" || action === "close-modal-bg") {
      if (action === "close-modal-bg" && e.target !== el) return;
      closeModal();
    }
    else if (action === "cart-qty") { changeQty(id, Number(el.getAttribute("data-delta"))); refreshCartModalLines(); }
    else if (action === "toggle-live-item") { toggleLiveItem(el.getAttribute("data-order"), el.getAttribute("data-item")); }
    else if (action === "mark-all-done") { markAllDone(el.getAttribute("data-order")); }
    else if (action === "clear-order") { clearCart(); closeModal(); renderOrderTab(); }
    else if (action === "confirm-order") {
      var lines = cartLines();
      if (!lines.length) return;
      var note = document.getElementById("dc-order-note") ? document.getElementById("dc-order-note").value : "";
      orders.push({ id: uid(), timestamp: Date.now(), items: lines.map(function (l) { return { itemId: l.id, name: l.name, price: l.price, qty: l.qty, done: false }; }), total: cartTotal(lines), paymentMethod: selectedPayment, note: note || "" });
      saveOrders();
      clearCart();
      closeModal();
      renderOrderTab();
      refreshTabBadges();
      showToast("Order logged \u2713");
    }
    else if (action === "set-payment") { selectedPayment = el.getAttribute("data-method"); document.querySelectorAll("#dc-payment-pills .dc-pill").forEach(function (p) { p.classList.toggle("dc-pill-active", p.getAttribute("data-method") === selectedPayment); }); }
    else if (action === "open-add-item") { openItemForm(null); }
    else if (action === "edit-item") { var it = items.find(function (i) { return i.id === id; }); openItemForm(it); }
    else if (action === "ask-delete-item") { confirmDeleteId = id; renderMenuTab(); }
    else if (action === "confirm-delete-item") {
      items = items.filter(function (i) { return i.id !== id; });
      delete cart[id];
      saveItems();
      confirmDeleteId = null;
      renderMenuTab();
    }
    else if (action === "save-item") { saveItemFromForm(); }
    else if (action === "open-name-edit") { openNameEditModal(); }
    else if (action === "open-sync") { openSyncModal(); }
    else if (action === "save-and-connect-drive") {
      var cid = document.getElementById("dc-client-id-input").value.trim();
      if (!cid) { showToast("Paste your Google Client ID first"); return; }
      googleClientId = cid;
      try { localStorage.setItem(CLIENT_ID_KEY, cid); } catch (e) {}
      closeModal();
      connectDrive("consent");
    }
    else if (action === "disconnect-drive") { disconnectDrive(); }
    else if (action === "save-shop-name") {
      var v = document.getElementById("dc-shop-name-input").value.trim();
      shopName = v || DEFAULT_SHOP_NAME;
      saveShopName();
      closeModal();
      render();
    }
    else if (action === "set-date-filter") { dateFilter = el.getAttribute("data-filter"); renderSalesTab(); }
    else if (action === "export-excel") { exportExcel(); }
  });

  // ---------- boot ----------
  loadAll();
  render();
  refreshTabBadges();
  tryAutoReconnect();
})();
</script>
</body>
</html>
